<!DOCTYPE html>
<html>
    <head>
        <title>الخريطة</title>
        <link href="https://www.riyadhbus.sa/o/rcrc-theme/images/favicon.ico" rel="icon">
        <link rel="stylesheet" href="RiyadhMetro.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="RiyadhMetro.js"></script>
        <link href="https://www.riyadhbus.sa/o/rcrc-theme/images/favicon.ico" rel="icon">
    </head>
    <body>
        <div class="banner">
            <div class="navbar">
                <img src="photo/Riyadh_metro_logo.png" class="logo">
                <ul>
                    <li><a href="HomePage.html">الرئيسية</a></li>
                    <li><a href="Stations.html">الخطوط</a></li>
                    <li><a href="TicketPage.html">التذاكر</a></li>
                    <li><a href="contact.html">الدعم</a></li>
                    <li><a href="profile.html">الملف الشخصي</a></li>
                    <li><a href="Paths.html">English</a></li>
                </ul>
            </div>
        <main>
            <div id="trip-planner-container" style="display: flex;">
    <!-- نموذج تخطيط الرحلة -->
    <div id="trip-planner" style="padding: 10px; background-color: rgba(194,194,194,0.713); border-radius: 20px; margin-right: 70px; width: 300px;">
        <h3 style="color: rgba(0,0,0,0.0.1); font-weight: bold; font-size: 25px;">خطط رحلتك <button id="info-button" style="top: 10px; right: 10px; background: transparent; border: none; cursor: pointer;">
        
        </button></h3>
        

    <!-- صندوق المعلومات (مخفي في البداية) -->
    <div id="info-box" style="font-size: 15px; display: none; top: 50px; right: 10px; background: white; padding: 5px; border: 1px solid #ccc; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border-radius: 5px; z-index: 1000;">
        <p>يمكنك رؤية الخريطة للعثور على أقرب المحطات إلى موقعك ووجهتك، ومعرفة الخطوط التي تقع عليها. 
            ثم يمكنك اختيارها أدناه.</p>
    </div>
        <!-- اختيار الخط للانطلاق -->
        <div style="margin-bottom: 20px;">
            <label for="departure-line" style="font-weight: bold; font-size: 30px;">خط الانطلاق:</label>
            <select id="departure-line" style="width: 100%; padding: 5px; margin-top: 5px;  border-radius: 5px; font-size: 16px; font-weight: bold;">
                <option value="" disabled selected>اختر خطاً</option>
                <option value="line1">الخط 1 (أزرق)</option>
                <option value="line2">الخط 2 (أحمر)</option>
                <option value="line3">الخط 3 (برتقالي)</option>
                <option value="line4">الخط 4 (أصفر)</option>
                <option value="line5">الخط 5 (أخضر)</option>
                <option value="line6">الخط 6 (بنفسجي)</option>
            </select>
        </div>

        <!-- اختيار محطة الانطلاق -->
        <div style="margin-bottom: 20px;">
            <label for="departure" style="font-weight: bold; font-size: 30px;">اختر محطة الانطلاق:</label>
            <select id="departure" style="width: 100%; padding: 5px; margin-top: 5px; border-radius: 5px; font-size: 16px; font-weight: bold;" disabled>
                <option value="" disabled selected>اختر محطة الانطلاق</option>
            </select>
        </div>

        <!-- اختيار الخط للوجهة -->
        <div style="margin-bottom: 20px;">
            <label for="destination-line" style="font-weight: bold; font-size: 30px;">خط الوجهة:</label>
            <select id="destination-line" style="width: 100%; padding: 5px; margin-top: 5px; border-radius: 5px; font-size: 16px; font-weight: bold;">
                <option value="" disabled selected>اختر خطاً</option>
                <option value="line1">الخط 1 (أزرق)</option>
                <option value="line2">الخط 2 (أحمر)</option>
                <option value="line3">الخط 3 (برتقالي)</option>
                <option value="line4">الخط 4 (أصفر)</option>
                <option value="line5">الخط 5 (أخضر)</option>
                <option value="line6">الخط 6 (بنفسجي)</option>
            </select>
        </div>

        <!-- اختيار محطة الوجهة -->
        <div style="margin-bottom: 20px;">
            <label for="destination" style="font-weight: bold; font-size: 30px;">اختر محطة الوجهة:</label>
            <select id="destination" style="width: 100%; padding: 5px; margin-top: 5px; border-radius: 5px; font-size: 16px; font-weight: bold;" disabled>
                <option value="" disabled selected>اختر محطة الوجهة</option>
            </select>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="plan-trip" style="padding: 10px 20px; border: none; background-color: #6fd450; color: white; border-radius: 5px; cursor: pointer;">خطط الرحلة</button>
            <button id="reset-trip" style="padding: 10px 20px; border: none; background-color: #ddd; border-radius: 5px; cursor: pointer;">إعادة تعيين</button>
        </div>
    </div>
        <div id="map" style="height: 850px; width: 1400px; margin-left: 30px; border-radius: 20px;"></div>
        </div>
        </main>
        
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="map.js"></script>
        <video style="    display: block;
        margin: 0 auto;
        max-width: 100%;
        height: auto;" src="Pics/moving-metro.mp4" autoplay="" muted="" loop=""></video>
    </body>
</html>
