name: Node.js CI

on:
  push:
    branches:
      - adelfahad-test  # يمكن تعديل هذا ليشمل الفروع التي تعمل عليها

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testdb
          MYSQL_ROOT_PASSWORD: testrootpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4  # التحقق من الكود
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libmysqlclient-dev libgirepository1.0-dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # تحديد إصدار Node.js
      - name: Install dependencies
        run: cd Server && npm ci  # تثبيت التبعيات
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..10}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready";
              break;
            fi;
            echo "Waiting for MySQL...";
            sleep 5;
          done
      - name: Setup database schema
        run: |
          mysql -h 127.0.0.1 -u root --password=testrootpass testdb <<EOF
          CREATE TABLE IF NOT EXISTS contacts (
            id INT NOT NULL AUTO_INCREMENT,
            first_name VARCHAR(100) DEFAULT NULL,
            last_name VARCHAR(100) DEFAULT NULL,
            email VARCHAR(100) DEFAULT NULL,
            mobile VARCHAR(50) DEFAULT NULL,
            message TEXT,
            created_at TIMESTAMP NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (id)
          ) ENGINE=InnoDB AUTO_INCREMENT=44 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;
          EOF
      - name: Run tests
        env:
          MYSQL_DATABASE: testdb
          MYSQL_USER: root
          MYSQL_PASSWORD: testrootpass
          MYSQL_HOST: 127.0.0.1
        run: cd Server && npm test  # تشغيل الاختبارات