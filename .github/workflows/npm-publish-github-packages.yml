name: Node.js CI

on:
  push:
    branches:
      - adelfahad-test  # يمكن تعديل هذا ليشمل الفروع التي تعمل عليها

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: Root@1234
          MYSQL_DATABASE: test_database
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-timeout=5s --health-retries=5  # التحقق من أن MySQL يعمل بشكل سليم

    steps:
      - uses: actions/checkout@v4  # التحقق من الكود
      - uses: mirromutth/mysql-action@v1.1
        with:
          host port: 3800 # Optional, default value is 3306. The port of host
          container port: 3307 # Optional, default value is 3306. The port of container
          character set server: 'utf8' # Optional, default value is 'utf8mb4'. The '--character-set-server' option for mysqld
          collation server: 'utf8_general_ci' # Optional, default value is 'utf8mb4_general_ci'. The '--collation-server' option for mysqld
          mysql version: '8.0' # Optional, default value is "latest". The version of the MySQL
          mysql database: 'some_test' # Optional, default value is "test". The specified database which will be create
          mysql root password: ${{ secrets.RootPassword }} # Required if "mysql user" is empty, default is empty. The root superuser password
          mysql user: 'developer' # Required if "mysql root password" is empty, default is empty. The superuser for the specified database. Can use secrets, too
          mysql password: ${{ secrets.DatabasePassword }} # Required if "mysql user" exists. The password for the "mysql user"  
      - name: Fix permissions
        run: chmod +x ./node_modules/.bin/jest
      - uses: actions/setup-node@v4  # إعداد بيئة Node.js
        with:
          node-version: 20  # تحديد إصدار Node.js
      - name: Install dependencies
        run: cd Server && npm ci  # الانتقال إلى مجلد Server وتثبيت التبعيات
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..10}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready";
              break;
            fi;
            echo "Waiting for MySQL...";
            sleep 5;
          done
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..10}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready";
              break;
            fi;
            echo "Waiting for MySQL..."; 
            sleep 5;
          done
      - name: Setup database schema
        run: |
          mysql -h 127.0.0.1 -u root --password=Root@1234 test_database <<EOF
          CREATE TABLE IF NOT EXISTS contacts (
            id INT NOT NULL AUTO_INCREMENT,
            first_name VARCHAR(100) DEFAULT NULL,
            last_name VARCHAR(100) DEFAULT NULL,
            email VARCHAR(100) DEFAULT NULL,
            mobile VARCHAR(50) DEFAULT NULL,
            message TEXT,
            created_at TIMESTAMP NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (id)
          ) ENGINE=InnoDB AUTO_INCREMENT=44 DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;
          EOF
      - name: Run tests
        run: cd Server && npm test  # الانتقال إلى مجلد Server وتشغيل الاختبارات