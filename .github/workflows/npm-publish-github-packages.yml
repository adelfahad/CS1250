# يتأكد إن السيرفر يتثبت ويخلو من أخطاء الكتابة عند كل push أو pull request على main

name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server  # package.json موجود داخل مجلد Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci      # تثبيت المكتبات من package-lock.json
      - run: npm test    # فحص server.js من أخطاء الكتابة
