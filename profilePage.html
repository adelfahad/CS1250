<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="styleProfilePage.css">
    <link href="https://www.riyadhbus.sa/o/rcrc-theme/images/favicon.ico" rel="icon">    
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="profile">
                <img src="photo/profile.png" class="rounded-circle" width="150">
                <h3 id="username">Loading...</h3>
            </div>
            <ul class="menu">
                <li><a href="HomePage.html" style="text-decoration: none; color: inherit;">Home</a></li>
                <li><a href="TicketPage.html" style="text-decoration: none; color: inherit;">Tickets</a></li>
                <li><a href="user-tickets.html" style="text-decoration: none; color: inherit;">My Tickets</a></li>
                <li><a href="contact.html" style="text-decoration: none; color: inherit;">Support</a></li>
                <li><a href="Paths.html" style="text-decoration: none; color: inherit;">Map</a></li>
                <li><a href="Stations.html" style="text-decoration: none; color: inherit;">Lines</a></li>
                <li><a href="profilePage-Ar.html" style="text-decoration: none; color: inherit;">عربي</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="navbar">
                <ul>
                    <li><a href="logout" style="text-decoration: none; color: inherit;">Signout</a></li>
                    <img src="photo/logo.PNG" class="rouneded-circle" width="40">
                </ul>
            </div>
            <div class="about-section">
                <h2>About</h2>
                <h1>User Profile</h1>
                <p><strong>Full Name:</strong> <span id="fullName">Loading...</span></p>
                <p><strong>Phone:</strong> <span id="phone">Loading...</span></p>
                <p><strong>Date of Birth:</strong> <span id="birthdate">Loading...</span></p>
                <p><strong>Gender:</strong> <span id="gender">Loading...</span></p>
                <p><strong>Email:</strong> <span id="email">Loading...</span></p>
                <p><strong>Address:</strong> <span id="address">Loading...</span></p>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/profile')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch profile data');
                }
                return response.json();
            })
            .then(user => {
                document.getElementById('username').textContent = user.name;
                document.getElementById('fullName').textContent = user.name;
                document.getElementById('phone').textContent = user.phone;
                document.getElementById('birthdate').textContent = user.birthdate;
                const birthdate = new Date(user.birthdate);
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('birthdate').textContent = birthdate.toLocaleDateString('ar-SA', options) + ' (' + birthdate.toLocaleDateString('en-US', options) + ')';
                document.getElementById('gender').textContent = user.gender;
                document.getElementById('email').textContent = user.email;
                document.getElementById('address').textContent = user.address;
            })
            .catch(error => {
                console.error('Error:', error);
                window.location.href = 'logInSignUp.html';
            });
    </script>
</body>
</html>
