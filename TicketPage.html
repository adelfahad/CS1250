    <script>
        function togglePage() {
            let page1 = document.getElementById("page1");
            let page2 = document.getElementById("page2");
    
            if (page1.style.display === "none") {
                page1.style.display = "block";
                page2.style.display = "none";
            } else {
                page1.style.display = "none";
                page2.style.display = "block";
            }
        }
    </script>
    <script>
function createTicket(ticketClass, price, duration, hours) {
    const ticketData = { class: ticketClass, price: price, duration: duration, hours: hours };

    fetch('http://localhost:3000/generate-ticket', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include', // ✅ يضمن إرسال الكوكيز لجلب الـ session
        body: JSON.stringify(ticketData),
    })
    .then((response) => {
        if (!response.ok) {
            return response.json().then(err => { throw new Error(err.error || 'Failed to create ticket'); });
        }
        return response.json();
    })
    .then((data) => {
        if (data.barcode) {
            // ✅ إرسال البيانات لعرض صفحة التذكرة
            fetch('http://localhost:3000/display-ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    barcodeBase64: data.imageBase64,
                    price: price,
                    ticketClass: ticketClass,
                }),
            })
            .then((res) => res.text())
            .then((html) => {
                // ✅ عرض صفحة التذكرة
                document.write(html);
            });
        } else {
            alert('Failed to create ticket. Try again.');
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        alert(error.message); // ✅ عرض الخطأ للمستخدم
    });
}
    </script>
